<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#faf8f3" />
  <title>QR-Codes für Tische — Site Refresh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family:'DM Sans',sans-serif; background:#faf8f3; color:#242720; }
    h1,h2,.serif { font-family:'Playfair Display',serif; }
    .qr-code canvas,.qr-code img { margin:auto; }
    @media print {
      header,.print-actions { display:none!important; }
      body { background:#fff; }
      #qr-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
      .qr-card { break-inside:avoid; padding:10px; }
    }
  </style>
</head>
<body>
  <header class="border-b border-black/5 bg-white/80">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5">
      <a href="../index.html" class="flex items-center gap-3"><img src="../assets/site-refresh-logo-scharf.png" alt="" class="h-11 w-14 object-contain" /><span><span class="block serif text-lg">Site Refresh</span><span class="block text-[9px] uppercase tracking-[.19em] text-stone-500">Tisch-QR-Codes</span></span></a>
      <button type="button" onclick="window.print()" class="print-actions rounded-full bg-[#b8732e] px-5 py-3 text-sm font-semibold text-white">Alle QR-Codes drucken</button>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-5 py-10 md:py-14">
    <p class="text-xs font-bold uppercase tracking-[.22em] text-[#bd762d]">Für den Restaurantbetrieb</p>
    <h1 class="mt-3 text-4xl sm:text-5xl">QR-Codes für Tische</h1>
    <p class="mt-3 max-w-2xl text-sm leading-6 text-stone-600">Jeder QR-Code öffnet die Speisekarte mit dem passenden Tisch vorausgewählt. Drucken Sie diese Seite oder speichern Sie einzelne QR-Codes.</p>
    <p id="qr-error" class="mt-5 hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800" role="alert"></p>
    <div id="qr-grid" class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="qr-codes.js" defer></script>
</body>
</html>
